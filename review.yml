    section1033Posture: 'n/a (Canadian institution; US 12 CFR 1033 does not apply)'
    consumerDrivenBankingPosture: 'Publicly supportive; framework legislated but not operational as of review date'
    aggregatorAccess: 'Flinks (Flinks Outbound) — consumer-permissioned data sharing'
    authModel: 'none documented (no public API surface; aggregator manages auth/consent)'
  transports:
