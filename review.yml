  probes:
    - url: https://developer.equitablebank.ca
      status: '000'
      note: Does not resolve — no developer portal.
    - url: https://api.equitablebank.ca
      status: '000'
      note: Does not resolve — no API host.
    - url: https://www.equitablebank.ca
      status: '200'
