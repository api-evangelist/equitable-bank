aid: equitable-bank
name: Equitable Bank
review:
  question: Does Equitable Bank (EQ Bank) expose a public first-party developer API or downloadable OpenAPI, or is data access aggregator-only?
  answer: false
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Equitable Bank / EQ Bank publishes NO public first-party developer API and
    NO downloadable OpenAPI/Swagger specification. Probing developer.equitablebank.ca,
    api.equitablebank.ca, and related developer/api subdomains returns no resolving
    host (HTTP 000). There is no public GitHub organization (github.com/equitable-bank
    returns 404). The corporate site (equitablebank.ca) and the EQ Bank consumer site
    (eqbank.ca) resolve (HTTP 200) but expose only marketing, product, and investor
    content — no API reference, no developer console, no spec.

    Consumer data access is aggregator-mediated: Equitable Bank / EQ Bank partnered
    with the Canadian aggregator Flinks and uses Flinks Outbound to let consenting
    EQ Bank customers share financial data with third-party fintech apps. This is
    screen-scraping / aggregator-style access managed by Flinks (onboarding,
    accreditation, support), not a documented first-party REST API surface owned by
    the bank. Flinks is a Canadian aggregator (National Bank of Canada owned).

    Charter/entity: Equitable Bank is a federally chartered, Canadian-owned Schedule I
    bank (Canada's seventh largest independent Schedule I bank by assets), a wholly
    owned subsidiary of EQB Inc. (TSX: EQB), CDIC member, HQ Toronto. This is the
    Canadian entity; there is no US arm to disambiguate.

    Open-finance posture: Canada's federal Consumer-Driven Banking (CDB) framework
    was legislated (Budget 2024 / Fall Economic Statement 2024, FCAC as overseer) but
    is NOT yet operational, so there is no live mandated open-banking/FDX API. Equitable
    Bank has published a public position supporting open banking and readiness for the
    coming framework, but exposes no CDB/FDX endpoint today.
  posture:
    firstPartyDeveloperPortal: false
    developerPortalURL: ''
    developerPortalHTTPStatus: '000 (developer.equitablebank.ca does not resolve)'
    downloadableOpenAPI: false
