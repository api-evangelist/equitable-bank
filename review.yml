actions:
  openapiHarvested: false
  reason: |
    No public first-party API and no downloadable OpenAPI/Swagger exist to harvest.
    Data access is aggregator-mediated via Flinks. Identity-only (built-stub) record
    with an honest aggregator-only data-access pointer is the correct, non-fabricated result.
