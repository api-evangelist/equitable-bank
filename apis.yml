apis:
- aid: equitable-bank:eq-bank-consumer-data-sharing
  name: EQ Bank Consumer Data Sharing (via Flinks)
  description: >-
    Equitable Bank / EQ Bank exposes no public first-party developer API. Under
    explicit customer consent, EQ Bank customers can share their financial data
    with third-party fintech applications through the Canadian data aggregator
    Flinks (Flinks Outbound). This is aggregator-mediated data access, not a
    documented first-party REST API, and no OpenAPI/Swagger specification is
    published. Listed here as an honest data-access pointer only.
  humanURL: https://eqb.investorroom.com/open-banking
