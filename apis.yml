name: Equitable Bank
kind: company
description: >-
  Equitable Bank is Canada's seventh largest independent Schedule I bank by
  assets and a wholly owned subsidiary of EQB Inc. (TSX: EQB), a Toronto-based
  Canadian financial services company with over CAD $144 billion in combined
  assets under management and administration. Federally chartered and Canadian
  owned, Equitable Bank markets itself as "Canada's Challenger Bank" and, in
  2016, launched EQ Bank, its digital-only banking platform offering high
  interest savings accounts, GICs, and payments alongside the parent bank's
  single-family residential and commercial lending. Equitable Bank and Equitable
  Trust are members of the Canada Deposit Insurance Corporation (CDIC). On the
  open-finance front, Equitable Bank does not operate a public first-party
  developer portal or publish downloadable API specifications; consumer
  permissioned data sharing is delivered through the Canadian aggregator Flinks
  (Flinks Outbound) rather than a first-party API. Canada's federal
  Consumer-Driven Banking framework (legislated in Budget 2024 with the
  Financial Consumer Agency of Canada as overseer) is not yet operational, so
  the bank's data-access posture today is voluntary and aggregator-mediated.
